name: Build bundled Greece roads SQLite
on:
  push:
    paths:
      - ".github/workflows/bundle-greece-roads.yml"
      - "scripts/build_greece_sqlite.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: python -m pip install osmium
      - name: Download Greece OSM source
        run: |
          mkdir -p source dist
          curl --fail --location --retry 3 --max-time 1800 -o source/greece.osm.pbf https://download.geofabrik.de/europe/greece-latest.osm.pbf
          test "$(wc -c < source/greece.osm.pbf)" -gt 200000000
          sha256sum source/greece.osm.pbf
      - name: Generate spatial SQLite and verify
        run: |
          python scripts/build_greece_sqlite.py --pbf source/greece.osm.pbf --out dist/greece_roads.sqlite --manifest dist/greece_roads.json
          python - <<'PY'
          import hashlib,json,pathlib,sqlite3
          p=pathlib.Path("dist/greece_roads.sqlite")
          m=json.loads(pathlib.Path("dist/greece_roads.json").read_text())
          assert p.stat().st_size==m["bytes"]
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m["sha256"]
          db=sqlite3.connect(str(p))
          assert db.execute("pragma integrity_check").fetchone()[0]=="ok"
          assert db.execute("select count(*) from roads").fetchone()[0]==m["road_segments"]
          print("SQLITE_QA> PASS",m["bytes"],m["road_segments"])
          PY
      - name: Publish release for APK bundling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create greece-bundle-v1 dist/greece_roads.sqlite dist/greece_roads.json --title "Greece nationwide offline streets v1" --notes "SQLite spatial index of named OSM roads for offline street suggestions. © OpenStreetMap contributors; ODbL." --latest
